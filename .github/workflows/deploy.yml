name: Deploy Dashboard API
on:
  push:
    branches: [main]
    paths: ['worker/**', 'migrations/**', 'wrangler.toml']
  workflow_dispatch:
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm ci
      - run: npx tsx tests/test-dashboard-phase3.mjs
      - run: sed -i "s/REPLACE_WITH_REAL_D1_DATABASE_ID/${{ vars.KLUZAR_ACCOUNTS_D1_ID }}/" wrangler.toml
      - run: npx wrangler d1 migrations apply kluzar-accounts --remote
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      - run: npx wrangler deploy
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
